<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="back-btn" hidden aria-label="Voltar">&#8592;</button>
    <img id="home-logo" class="topbar-mark" src="/brand/icon-192.png" alt="BR Trading">
    <h1 id="page-title">Missão China</h1>

  <a class="outbox-bar" id="outbox-bar" href="#/outbox" hidden></a>
  <main id="app" aria-live="polite"></main>

    <div class="map-frame" id="map-frame"></div>
  </section>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/ranking" data-tab="ranking"><span><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg></span>Vantagens</a>
