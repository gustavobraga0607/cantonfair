<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Canton Fair Buyer by BR Trading</title>
  <meta name="description" content="Canton Fair Buyer by BR Trading — apoio ao comprador na Feira de Cantão.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Canton Buyer">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="back-btn" hidden aria-label="Voltar">&#8592;</button>
    <img id="home-logo" class="topbar-mark" src="/brand/icon-192.png" alt="BR Trading">
    <h1 id="page-title">Canton Fair Buyer</h1>
    <span class="rate-chip" id="rate-chip" title="Câmbio usado nas estimativas"></span>
  </header>

  <main id="app" aria-live="polite"></main>

  <!-- Mapa oficial da feira: criado uma vez e mantido carregado entre as abas. -->
  <section class="map-view" id="map-view" hidden>
    <div class="map-toolbar">
      <nav class="subnav" aria-label="Roteiro"><a href="#/trip">Roteiro</a><a href="#/map" class="active">Mapa da feira</a></nav>
      <a class="btn small" id="map-open" target="_blank" rel="noopener">Abrir ↗</a>
    </div>
    <div class="map-frame" id="map-frame"></div>
  </section>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/ranking" data-tab="ranking"><span>&#9733;</span>Vantagens</a>
    <a href="#/products" data-tab="products"><span>&#9638;</span>Produtos</a>
    <a href="#/suppliers" data-tab="suppliers"><span>&#9742;</span>Fornecedores</a>
    <a href="#/trip" data-tab="trip"><span><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg></span>Roteiro</a>
    <a href="#/account" data-tab="account"><span>&#9881;</span>Conta</a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script src="/app.js"></script>
</body>
</html>
